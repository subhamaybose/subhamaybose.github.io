<!DOCTYPE HTML>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="robots" content="noindex">
   <title>Page Not Found | Subhamay Bose</title>
   <link rel="shortcut icon" href="images/favicon.png">
   <style>
      body {
         margin: 0;
         min-height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         background-color: #0d0d0d;
         color: #fff;
         font-family: Arial, Helvetica, sans-serif;
         text-align: center;
         padding: 20px;
         box-sizing: border-box;
      }
      .not-found h1 {
         font-size: 6rem;
         margin: 0;
         color: #e1b783;
      }
      .not-found p {
         font-size: 1.2rem;
         margin: 10px 0 30px;
      }
      .not-found a {
         display: inline-block;
         padding: 12px 28px;
         border: 1px solid #e1b783;
         color: #e1b783;
         text-decoration: none;
         border-radius: 4px;
         transition: background-color .2s ease, color .2s ease;
      }
      .not-found a:hover {
         background-color: #e1b783;
         color: #0d0d0d;
      }
   </style>
</head>
<body>
   <div class="not-found">
      <h1>404</h1>
      <p>This page doesn't exist &mdash; but the rest of the site does.</p>
      <a href="/">Back to Subhamay Bose's portfolio</a>
   </div>
</body>
</html>
